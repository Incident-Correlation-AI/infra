name: deploy-lambdas-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lambda-cd
  cancel-in-progress: true

env:
  AWS_REGION: eu-north-1
  API_ID: d6l60no0kk
  API_BASE: https://d6l60no0kk.execute-api.eu-north-1.amazonaws.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Run test suite
        run: |
          pip install -q -r dev-requirements.txt || true
          if [ -f dev-requirements.txt ] || [ -f pytest.ini ] || [ -d tests ]; then
            python -m pytest -q
          else
            echo "no tests present yet; skipping"
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (gh-deploy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build function packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          map_function() {
            # src_dir  target_function
            local src="$1" tfn="$2"
            [ -d "$src" ] || { echo "skip $tfn: $src missing in repo"; return 0; }
            rm -rf "build/$tfn"; mkdir -p "build/$tfn"
            cp -a "$src"/. "build/$tfn/"
            [ -d src ] && cp -a src "build/$tfn/" || true
            find "build/$tfn" -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
            (cd "build/$tfn" && zip -qr "../$tfn.zip")
            echo "built $tfn.zip from $src"
          }
          map_function services/api/ingest     IncidentIngestFn
          map_function services/api/incidents  IncidentReadFn
          map_function services/worker         IncidentWorkerFn
          map_function services/api/authorizer IncidentAuthorizerFn

      - name: Deploy function code
        shell: bash
        run: |
          set -euo pipefail
          for tfn in IncidentIngestFn IncidentReadFn IncidentWorkerFn IncidentAuthorizerFn; do
            if [ -f "build/$tfn.zip" ]; then
              aws lambda update-function-code \
                --region "$AWS_REGION" --function-name "$tfn" \
                --zip-file "fileb://build/$tfn.zip" \
                --query 'LastUpdateStatus' --output text
              aws lambda wait function-updated --region "$AWS_REGION" --function-name "$tfn"
              echo "deployed $tfn"
            fi
          done

      - name: Smoke check (health + preflight)
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          code_h=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE/api/v1/health")
          code_p=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            "$API_BASE/api/v1/incidents" \
            -H 'Origin: http://localhost:5173' -H 'Access-Control-Request-Method: GET')
          echo "health=$code_h preflight=$code_p"
          [ "$code_h" = "200" ] || echo "::warning::health returned $code_h (mock ingest contract may still be 400)"
          [ "$code_p" = "204" ] || { echo "::error::preflight returned $code_p"; exit 1; }

      - name: Authenticated e2e (optional, needs app secrets)
        if: ${{ env.LAD_SMOKE_COLLECTOR_TOKEN != '' && env.LAD_SMOKE_ADMIN_TOKEN != '' }}
        env:
          LAD_SMOKE_COLLECTOR_TOKEN: ${{ secrets.LAD_SMOKE_COLLECTOR_TOKEN }}
          LAD_SMOKE_ADMIN_TOKEN: ${{ secrets.LAD_SMOKE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$API_BASE/api/v1/events/batch" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $LAD_SMOKE_COLLECTOR_TOKEN" \
            -d '{"events":[{"event_id":"cd-smoke-'$GITHUB_RUN_ID'","message":"CD smoke"}]}')
          a=$(curl -s -o /dev/null -w '%{http_code}' "$API_BASE/api/v1/incidents" \
            -H "Authorization: Bearer $LAD_SMOKE_ADMIN_TOKEN")
          echo "batch=$c list=$a"
          [ "$c" = "202" ] || { echo "::error::batch smoke returned $c"; exit 1; }
          [ "$a" = "200" ] || { echo "::error::list smoke returned $a"; exit 1; }
